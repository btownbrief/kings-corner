<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#123524"/>
  <!-- the park lawn -->
  <circle cx="50" cy="58" r="44" fill="#1b4a31"/>
  <!-- brick paths crossing to the center -->
  <path d="M14 22 L86 94 M86 22 L14 94" stroke="#8f3d1f" stroke-width="7" opacity="0.5"/>
  <!-- back card, brick -->
  <g transform="rotate(9 62 52)">
    <rect x="46" y="22" width="34" height="48" rx="6" fill="#b5542a" stroke="#f6efdc" stroke-width="2.5"/>
    <circle cx="63" cy="46" r="7" fill="none" stroke="#f6efdc" stroke-width="2" opacity="0.55"/>
  </g>
  <!-- front card, the King -->
  <g transform="rotate(-8 42 54)">
    <rect x="24" y="26" width="36" height="52" rx="6" fill="#f6efdc" stroke="#123524" stroke-width="2.5"/>
    <text x="42" y="64" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#1d2733" text-anchor="middle">K</text>
    <text x="30.5" y="38" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="9" font-weight="900" fill="#1d2733" text-anchor="middle">♠</text>
    <text x="53.5" y="73.5" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="9" font-weight="900" fill="#1d2733" text-anchor="middle">♠</text>
  </g>
  <!-- crown in the corner -->
  <text x="80" y="27" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle">👑</text>
  <!-- park tree -->
  <text x="17" y="91" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">🌳</text>
</svg>
